name: Admin - delete a player

# Run by hand from the Actions tab: deletes one player and everything tied to
# them (scripts/admin-delete-player.mjs). It can't be undone.
on:
  workflow_dispatch:
    inputs:
      username:
        description: Username of the player to delete
        required: true
        type: string
      confirm:
        description: Type DELETE to confirm
        required: true
        type: string

permissions: {}

jobs:
  delete:
    runs-on: ubuntu-latest
    # Add yourself as a required reviewer for the "admin" environment (Settings > Environments),
    # so a run waits for your approval, even if someone else can start workflows.
    environment: admin
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - if: inputs.confirm != 'DELETE'
        run: |
          echo "Type DELETE in the confirm box to run this."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The username is read from the event file by the script, not passed here,
      # so it doesn't show in this public log.
      - run: node scripts/admin-delete-player.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Every 15 minutes: refresh the bundled Polymarket snapshot and Chaminade games/results (public/data/).
  # Scheduled runs always build the latest commit on main, so they redeploy reviewed code with fresh data only.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

# Queue rather than cancel, so a scheduled refresh never kills a deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Actions are pinned to commit SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high --omit=dev
      - run: npm test
      - name: Database tests (supabase/schema.sql on the runner's Postgres)
        run: npm run test:db
      - name: Fetch Polymarket and Chaminade snapshots
        run: npm run snapshot
      - run: npm run build
        env:
          # Public Supabase settings (safe to ship in the page). Empty means the app runs in local mode.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

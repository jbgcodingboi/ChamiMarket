name: Chaminade site probe (temporary)

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build snapshots against the real sources
        run: |
          npm run snapshot
          node -e "const c=require('./public/data/chaminade.json');console.log('results sample', JSON.stringify(Object.entries(c.results).slice(-8)));console.log('first market', JSON.stringify(c.markets[0], null, 1))"

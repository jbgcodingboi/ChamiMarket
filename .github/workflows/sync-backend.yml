name: Sync backend

# Keeps the Supabase backend's prices and results current (scripts/sync-backend.mjs).
# Does nothing until the SUPABASE_URL variable and SUPABASE_SERVICE_ROLE_KEY secret are set.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-backend
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      # Only whether the backend is set up. The key itself is handed to the one step that needs it.
      CONFIGURED: ${{ vars.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
    steps:
      - if: env.CONFIGURED != 'true'
        run: echo "Backend not configured yet; skipping."
      - if: env.CONFIGURED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.CONFIGURED == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - if: env.CONFIGURED == 'true'
        run: npm ci --ignore-scripts
      - if: env.CONFIGURED == 'true'
        run: node scripts/sync-backend.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

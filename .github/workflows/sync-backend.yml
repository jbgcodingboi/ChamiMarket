name: Sync backend

# A manual backup for the sync (scripts/sync-backend.mjs). The database runs the same sync every 5 minutes
# through the Supabase sync function (see deploy-sync.yml), so nothing schedules this one.
# Does nothing until the SUPABASE_URL variable and SUPABASE_SERVICE_ROLE_KEY secret are set.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-backend
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      # Only whether the backend is set up. The key itself is handed to the one step that needs it.
      CONFIGURED: ${{ vars.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
    steps:
      - if: env.CONFIGURED != 'true'
        run: echo "Backend not configured yet; skipping."
      - if: env.CONFIGURED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.CONFIGURED == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # No npm install: the script only uses Node built-ins and the app's own source files.
      - if: env.CONFIGURED == 'true'
        run: node scripts/sync-backend.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

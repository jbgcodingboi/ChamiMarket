name: Snapshot dry run (temporary)

on:
  push:
    branches: ['claude/**']

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run snapshot
      - name: Exercise the browser-side Quick sources from Node
        run: |
          cat > probe.mjs <<'JS'
          import { COINS, fetchCoinData, buildCoinMarkets } from './src/services/quick/crypto.js'
          import { STATIONS, fetchForecast, buildWeatherMarkets, fetchClimateReports } from './src/services/quick/weather.js'
          import { fetchGamesFor } from './src/services/quick/espn.js'
          const now = Date.now()
          for (const c of COINS) { const d = await fetchCoinData(c, now); console.log(c.id, JSON.stringify(d)); for (const m of buildCoinMarkets(c, d, now)) console.log('  ', Math.round(m.yesPrice*100)+'%', m.title) }
          for (const s of STATIONS) {
            const p = await fetchForecast(s); for (const m of buildWeatherMarkets(s, p, now)) console.log('  ', Math.round(m.yesPrice*100)+'%', m.title, '|', m.eventTitle)
            console.log(s.id, 'reports', JSON.stringify(await fetchClimateReports(s)))
          }
          const games = await fetchGamesFor({ league: 'nba', endDate: new Date(now).toISOString(), gameStart: new Date(now - 864e5).toISOString() })
          console.log('espn nba yesterday', games.length, JSON.stringify(games[0]))
          JS
          node probe.mjs
